name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Publish as snapshot (no GitHub release)?'
        required: false
        default: 'false'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    env:
      GOEXPERIMENT: jsonv2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0

      - name: Verify module
        run: |
          go mod download
          go version
          go env GOEXPERIMENT

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: >-
            release
            --clean
            ${{ github.event_name == 'workflow_dispatch' && inputs.snapshot == 'true' && '--snapshot --skip=publish,sign' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_YES: "true"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact-name: kiroxy-sbom.spdx.json
          output-file: ./dist/kiroxy-sbom.spdx.json

      - name: Sign checksums with cosign
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          cosign sign-blob --yes \
            --output-signature dist/checksums.sig \
            --output-certificate dist/checksums.pem \
            dist/*_checksums.txt

      - name: Upload release artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/*.tar.gz
            dist/*_checksums.txt
            dist/checksums.sig
            dist/checksums.pem
            dist/kiroxy-sbom.spdx.json
            dist/metadata.json
            dist/artifacts.json
          if-no-files-found: warn
          retention-days: 30

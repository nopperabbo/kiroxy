name: Lock Threads

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: lock-threads
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-inactive-days: 30
          issue-lock-reason: resolved
          pr-inactive-days: 30
          pr-lock-reason: resolved
          log-output: true

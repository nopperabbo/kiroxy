# Dependabot — weekly cadence for security responsiveness.
#
# Aggressive grouping — minor + patch updates batched per ecosystem
# so one merge sweeps a whole ecosystem at once.
# Major versions get their own PR — they need human review anyway.

version: 2
updates:
  # Go modules — backend
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # NPM — Mansion dashboard
  - package-ecosystem: "npm"
    directory: "/internal/server/mansion/client"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      mansion-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # NPM — Dashboard Next (experimental)
  - package-ecosystem: "npm"
    directory: "/internal/server/next/client"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "frontend"
      - "experimental"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      next-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # NPM — Landing page
  - package-ecosystem: "npm"
    directory: "/web/landing"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "landing"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      landing-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

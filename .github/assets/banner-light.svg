<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none">
  <defs>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b6914"/>
      <stop offset="50%" stop-color="#a67c1a"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="text-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1815"/>
      <stop offset="100%" stop-color="#2d2a24"/>
    </linearGradient>
  </defs>

  <!-- Logo mark: rounded rect with "k" -->
  <rect x="60" y="52" width="96" height="96" rx="18" fill="#faf8f5" stroke="#8b6914" stroke-width="2.5"/>
  <text x="108" y="118" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="56" font-weight="700" fill="url(#amber-glow)">k</text>

  <!-- Wordmark -->
  <text x="192" y="118" text-anchor="start"
        font-family="ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="64" font-weight="600" fill="url(#text-fade)"
        letter-spacing="-2">kiroxy</text>

  <!-- Tagline -->
  <text x="192" y="150" text-anchor="start"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="16" font-weight="400" fill="#6b6560"
        letter-spacing="0.5">Self-hosted AI proxy. One endpoint, every model.</text>
</svg>

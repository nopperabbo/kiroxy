<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfcfa"/>
      <stop offset="50%" stop-color="#f8f5f0"/>
      <stop offset="100%" stop-color="#fdfcfa"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b6914"/>
      <stop offset="50%" stop-color="#a67c1a"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="text-main" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1815"/>
      <stop offset="100%" stop-color="#2d2a24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a34a" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c9a34a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg-grad)"/>

  <!-- Subtle ambient light -->
  <ellipse cx="600" cy="150" rx="400" ry="150" fill="url(#spot)"/>

  <!-- Top border accent -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#amber)" opacity="0.4"/>

  <!-- Logo mark -->
  <rect x="420" y="70" width="80" height="80" rx="16" fill="#faf8f5" stroke="url(#amber)" stroke-width="2"/>
  <text x="460" y="125" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="44" font-weight="700" fill="url(#amber)" filter="url(#glow)">k</text>

  <!-- Wordmark -->
  <text x="520" y="127" text-anchor="start"
        font-family="ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="56" font-weight="600" fill="url(#text-main)"
        letter-spacing="-1">kiroxy</text>

  <!-- Tagline -->
  <text x="600" y="185" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="18" font-weight="400" fill="#6b6560"
        letter-spacing="0.5">Self-hosted AI proxy. One binary. Zero telemetry.</text>

  <!-- Decorative line -->
  <line x1="450" y1="210" x2="750" y2="210" stroke="url(#amber)" stroke-width="1" opacity="0.3"/>

  <!-- Stats row -->
  <text x="490" y="250" text-anchor="middle"
        font-family="ui-monospace, monospace" font-size="12" fill="#8a8579">23,810 req/s</text>
  <text x="600" y="250" text-anchor="middle"
        font-family="ui-monospace, monospace" font-size="12" fill="#8a8579">~22 MiB binary</text>
  <text x="710" y="250" text-anchor="middle"
        font-family="ui-monospace, monospace" font-size="12" fill="#8a8579">Go 1.26</text>

  <!-- Dots separator -->
  <circle cx="545" cy="247" r="1.5" fill="#8b6914" opacity="0.5"/>
  <circle cx="655" cy="247" r="1.5" fill="#8b6914" opacity="0.5"/>
</svg>

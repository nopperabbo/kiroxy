<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#1e1b17"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a34a"/>
      <stop offset="50%" stop-color="#e0be6a"/>
      <stop offset="100%" stop-color="#c9a34a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9a34a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c9a34a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg-grad)"/>

  <!-- Subtle radial glow behind logo -->
  <circle cx="640" cy="280" r="300" fill="url(#glow)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#c9a34a" stroke-width="0.5">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Logo mark -->
  <rect x="556" y="180" width="168" height="168" rx="32" fill="#1a1a1a" stroke="#c9a34a" stroke-width="3"/>
  <text x="640" y="295" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="96" font-weight="700" fill="url(#amber-grad)">k</text>

  <!-- Wordmark -->
  <text x="640" y="420" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace"
        font-size="72" font-weight="600" fill="#f5f0e8"
        letter-spacing="-2">kiroxy</text>

  <!-- Tagline -->
  <text x="640" y="470" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="22" font-weight="400" fill="#8a8579"
        letter-spacing="0.5">Self-hosted AI proxy. One endpoint, every model.</text>

  <!-- Bottom stats bar -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace" font-size="14" fill="#6b6560">
    <text x="360" y="560" text-anchor="middle">MIT Licensed</text>
    <text x="540" y="560" text-anchor="middle">Single Binary</text>
    <text x="720" y="560" text-anchor="middle">~30 MiB Docker</text>
    <text x="920" y="560" text-anchor="middle">23,810 rps</text>
  </g>

  <!-- Separator dots -->
  <g fill="#c9a34a" opacity="0.4">
    <circle cx="450" cy="557" r="2"/>
    <circle cx="630" cy="557" r="2"/>
    <circle cx="820" cy="557" r="2"/>
  </g>

  <!-- Top border accent -->
  <rect x="0" y="0" width="1280" height="2" fill="url(#amber-grad)" opacity="0.6"/>
</svg>
